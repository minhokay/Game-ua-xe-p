<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đua Xe Đạp 3D Di Động - Bản Chuẩn Tuyệt Đối</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050505; 
            font-family: Arial, sans-serif; user-select: none; color: #fff;
            touch-action: none;
        }

        /* Giao diện Menu chính */
        .screen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a, #020617);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; box-sizing: border-box; padding: 15px;
        }
        .menu-box {
            background: rgba(15, 23, 42, 0.98); border: 2px solid #38bdf8;
            padding: 25px; border-radius: 20px; text-align: center;
            max-width: 400px; width: 100%; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }
        h1 { color: #38bdf8; font-size: 22px; margin: 0 0 5px 0; text-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }
        
        /* Bộ chọn loại xe dạng Tab ngang chống lệch */
        .bike-options { display: flex; gap: 8px; margin: 15px 0; }
        .btn-bike {
            flex: 1; padding: 12px 5px; background: #1e293b; border: 2px solid #475569;
            color: #fff; font-weight: bold; border-radius: 10px; font-size: 13px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-bike.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

        .btn-main {
            background: linear-gradient(90deg, #f472b6, #38bdf8); color: white;
            border: none; padding: 15px; font-size: 18px; font-weight: bold;
            border-radius: 12px; cursor: pointer; width: 100%; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        /* Vùng chứa Game 3D */
        #gameContainer { width: 100%; height: 100%; display: none; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }

        #hud {
            position: absolute; top: 15px; left: 15px;
            background: rgba(10, 15, 30, 0.85); padding: 10px 15px;
            border-radius: 10px; border: 2px solid #38bdf8; pointer-events: none; z-index: 10;
        }
        .hud-line { margin: 3px 0; font-weight: bold; font-size: 13px; }

        /* Nút bấm cảm ứng giả lập trên màn hình */
        #mobileControls {
            position: absolute; bottom: 20px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box;
            z-index: 10;
        }
        .ctrl-group { display: flex; gap: 15px; }
        .btn-ctrl {
            width: 65px; height: 65px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: white; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menuOverlay" class="screen-overlay">
        <div class="menu-box">
            <h1>🚲 DOWNHILL 3D MOBILE 🚲</h1>
            <p style="color: #94a3b8; font-size: 12px; margin: 0 0 20px 0;">Đua xe đạp dốc 3D siêu mượt</p>

            <h3 style="color: #f472b6; font-size: 14px; text-align: left; margin: 10px 0 5px 0;">CHỌN XE CỦA CẬU:</h3>
            <div class="bike-options">
                <button id="b-pink" class="btn-bike active" onclick="changeBike('pink')">🌸 Hồng</button>
                <button id="b-yellow" class="btn-bike" onclick="changeBike('yellow')">⚡ Vàng</button>
                <button id="b-cyan" class="btn-bike" onclick="changeBike('cyan')">🌌 Xanh</button>
            </div>

            <button id="startBtn" class="btn-main">BẮT ĐẦU ĐỔ ĐÈO 🏁</button>
        </div>
    </div>

    <div id="gameContainer">
        <div id="hud">
            <div class="hud-line" style="color: #f472b6;">🏁 ĐÍCH CÒN: <span id="distance">500</span>m</div>
            <div class="hud-line" style="color: #38bdf8;">🚀 TỐC ĐỘ: <span id="speed">0</span> km/h</div>
        </div>
        
        <div id="mobileControls">
            <div class="ctrl-group">
                <div id="btn-left" class="btn-ctrl">◀</div>
                <div id="btn-right" class="btn-ctrl">▶</div>
            </div>
            <div class="ctrl-group">
                <div id="btn-gas" class="btn-ctrl" style="background: rgba(34, 197, 94, 0.3); border-color: #22c55e;">GO</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, bike, road;
        let gameState = "MENU";
        let bikeColor = "pink";
        
        let speed = 0;
        let maxSpeed = 0.8;
        let distance = 500;
        
        let inputGas = false, inputLeft = false, inputRight = false;

        function changeBike(color) {
            bikeColor = color;
            document.querySelectorAll('.btn-bike').forEach(b => b.classList.remove('active'));
            document.getElementById('b-' + color).classList.add('active');
            maxSpeed = color === 'pink' ? 0.7 : (color === 'yellow' ? 1.1 : 0.9);
        }

        // LẮNG NGHE SỰ KIỆN KHI NGƯỜI DÙNG TƯƠNG TÁC
        document.addEventListener("DOMContentLoaded", () => {
            const startBtn = document.getElementById("startBtn");
            
            // Nhận diện đồng thời cả click chuột lẫn chạm tay để kích hoạt 3D không bị chặn
            startBtn.addEventListener("click", initAndStartGame);
            startBtn.addEventListener("touchstart", (e) => {
                e.preventDefault();
                initAndStartGame();
            });

            // Cấu hình các nút bấm di chuyển ảo
            setupMobileButton('btn-gas', (v) => inputGas = v);
            setupMobileButton('btn-left', (v) => inputLeft = v);
            setupMobileButton('btn-right', (v) => inputRight = v);
        });

        function setupMobileButton(id, pressCallback) {
            const el = document.getElementById(id);
            if (!el) return;
            
            // Xử lý mượt mà trên điện thoại
            el.addEventListener('touchstart', (e) => { e.preventDefault(); pressCallback(true); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); pressCallback(false); });
            
            // Xử lý dự phòng trên máy tính
            el.addEventListener('mousedown', () => pressCallback(true));
            el.addEventListener('mouseup', () => pressCallback(false));
            el.addEventListener('mouseleave', () => pressCallback(false));
        }

        function initAndStartGame() {
            if (gameState === "PLAYING") return;

            document.getElementById("menuOverlay").style.display = "none";
            document.getElementById("gameContainer").style.display = "block";
            
            gameState = "PLAYING";
            distance = 500;
            speed = 0;

            // Khởi tạo không gian 3D
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById("gameContainer").appendChild(renderer.domElement);

            // Ánh sáng
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            // Mô hình đường đua hình hộp dài
            const roadGeo = new THREE.BoxGeometry(12, 1, 600);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.position.set(0, -0.5, -280);
            scene.add(road);

            // Mô hình chiếc xe đạp khối tối giản tối ưu RAM di động
            bike = new THREE.Group();
            let colorHex = bikeColor === 'pink' ? 0xf472b6 : (bikeColor === 'yellow' ? 0xeab308 : 0x06b6d4);
            const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 1.2), new THREE.MeshStandardMaterial({ color: colorHex }));
            bodyMesh.position.y = 0.5;
            bike.add(bodyMesh);
            
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
            const w1 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.2, 12), wheelMat);
            w1.rotation.z = Math.PI/2; w1.position.set(0, 0.4, -0.5);
            bike.add(w1);
            const w2 = w1.clone(); w2.position.z = 0.5;
            bike.add(w2);

            scene.add(bike);

            // Bắt đầu vòng lặp đồ họa ổn định
            animate();
        }

        function animate() {
            if (gameState !== "PLAYING") return;
            requestAnimationFrame(animate);

            // Tính toán gia tốc vận tốc tịnh tiến
            if (inputGas) { speed = Math.min(speed + 0.01, maxSpeed); } 
            else { speed = Math.max(speed - 0.008, 0); }

            if (inputLeft) bike.position.x -= 0.08;
            if (inputRight) bike.position.x += 0.08;

            // Giới hạn lề đường không văng khỏi map
            if (bike.position.x < -5.5) bike.position.x = -5.5;
            if (bike.position.x > 5.5) bike.position.x = 5.5;

            // Di chuyển xe tiến lên và tạo hiệu ứng dốc nhấp nhô nhịp nhàng
            bike.position.z -= speed;
            bike.position.y = Math.sin(bike.position.z * 0.05) * 1.5;
            bike.rotation.x = Math.cos(bike.position.z * 0.05) * 0.08;

            distance -= speed * 0.1;

            // Đưa dữ liệu thực tế lên giao diện HUD hiển thị công khai
            document.getElementById("speed").innerText = Math.round(speed * 140);
            document.getElementById("distance").innerText = Math.max(0, Math.round(distance));

            // Camera bám đuôi mượt mà góc nhìn thứ ba ổn định vị trí
            camera.position.set(bike.position.x, bike.position.y + 2.2, bike.position.z + 4.5);
            camera.lookAt(bike.position.x, bike.position.y + 0.5, bike.position.z - 2);

            // Thực hiện render khung hình đồ họa
            renderer.render(scene, camera);

            // Điều kiện xử lý khi về đích hoàn hảo
            if (distance <= 0) {
                gameState = "MENU";
                alert("🏆 Quá xuất sắc! Cậu đã điều khiển xe đổ đèo về đích an toàn 3D thành công!");
                location.reload(); // Tải lại trang giải phóng bộ nhớ tạm thời của máy
            }
        }

        // Tự căn chỉnh tỷ lệ khung hình đồ họa khi xoay màn hình điện thoại
        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
