<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberBike 360° - Extreme Mobile Edition</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020408; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; color: #fff; touch-action: none; }
        .screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #040610, #090d1a); display: flex; justify-content: center; align-items: center; z-index: 100; box-sizing: border-box; padding: 10px; }
        .menu-box { background: rgba(6, 10, 24, 0.96); border: 2px solid #00ffcc; padding: 20px; border-radius: 20px; text-align: center; max-width: 450px; width: 100%; max-height: 95vh; overflow-y: auto; box-shadow: 0 0 35px rgba(0, 255, 204, 0.25); }
        h1 { color: #00ffcc; font-size: 20px; margin: 0 0 5px 0; text-shadow: 0 0 15px rgba(0, 255, 204, 0.5); }
        .section-title { font-size: 11px; font-weight: bold; color: #facc15; margin: 12px 0 6px 0; text-align: left; text-transform: uppercase; }
        
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
        .level-btn { padding: 8px 2px; text-align: center; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; border: 2px solid transparent; color: white; background: #1e293b; transition: 0.2s; }
        .level-btn.locked { background: #0f172a !important; color: #475569 !important; cursor: not-allowed; border: 1px dashed #334155; }
        .level-btn.active { border-color: #00ffcc; box-shadow: 0 0 12px #00ffcc; background: #0f766e; }

        .play-panel { display: flex; justify-content: center; margin-top: 15px; width: 100%; }
        .btn-play-active { background: linear-gradient(90deg, #00ffcc, #0284c7); color: #05070c; border: none; padding: 12px 35px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; display: none; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4); }

        #gameContainer { width: 100%; height: 100%; display: none; position: relative; }
        #hud { position: absolute; top: 15px; left: 15px; background: rgba(4, 6, 12, 0.85); padding: 10px 15px; border-radius: 8px; border: 1.5px solid #00ffcc; pointer-events: none; z-index: 10; }
        .hud-line { margin: 3px 0; font-weight: bold; font-size: 12px; }
        
        #alert-text { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; font-weight: bold; background: rgba(15, 5, 5, 0.95); border: 2px solid #ff3366; color: #ff6699; box-shadow: 0 0 25px #ff3366; padding: 20px; border-radius: 12px; display: none; pointer-events: none; z-index: 99; text-align: center; width: 80%; max-width: 360px; }
        #win-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 380px; background: rgba(4, 12, 8, 0.98); border: 3px solid #00ffcc; box-shadow: 0 0 40px #00ffcc; border-radius: 16px; padding: 25px; text-align: center; display: none; z-index: 100; }
        
        #mobileControls { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .ctrl-group { display: flex; gap: 15px; align-items: center; pointer-events: auto; }
        .btn-ctrl { width: 68px; height: 68px; background: rgba(15, 23, 42, 0.75); border: 2px solid rgba(0, 255, 204, 0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #00ffcc; }
        .btn-ctrl:active { background: rgba(0, 255, 204, 0.3); border-color: #00ffcc; }
        .btn-action { width: 78px; height: 78px; border-radius: 16px; font-size: 15px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="menuOverlay" class="screen-overlay">
        <div class="menu-box">
            <h1>🚲 CYBERBIKE 360°: REBORN V2 🚲</h1>
            <p style="color: #94a3b8; font-size: 11px; margin: 0;">30 Màn - 3 Chặng Thử Thách Thời Tiết</p>

            <div class="section-title">🗺️ CHỌN MÀN CHƠI (3 CHẶNG):</div>
            <div class="level-grid" id="levelGridContainer"></div>
            <div class="play-panel"><button id="mainPlayBtn" class="btn-play-active" onclick="initAndStartGame()">XUẤT PHÁT ĐUA 🏁</button></div>
        </div>
    </div>

    <div id="gameContainer">
        <div id="hud">
            <div class="hud-line" style="color: #facc15;">📍 MÀN <span id="hud-level-id">1</span> | MỤC TIÊU: <span id="target-dist">0</span> km</div>
            <div class="hud-line" style="color: #00ffcc;">🏁 TIẾN TRÌNH: <span id="distance">0</span> / <span id="total-length">0</span> km</div>
            <div class="hud-line" style="color: #38bdf8;">⚡ TỐC ĐỘ: <span id="speed">0</span> km/h</div>
        </div>
        <div id="alert-text"></div>
        <div id="win-screen">
            <h1 style="color: #00ffcc; font-size: 24px; text-shadow: 0 0 20px #00ffcc; margin: 0 0 10px 0;">🏆 THẮNG CUỘC! 🏆</h1>
            <p id="win-desc" style="font-size: 13px; color: #fff; margin-bottom: 20px;"></p>
            <button onclick="exitGameToMenu()" style="background: linear-gradient(90deg, #00ffcc, #0284c7); border: none; padding: 10px 25px; font-weight: bold; border-radius: 8px; cursor: pointer;">CHỌN MÀN TIẾP THEO</button>
        </div>
        <div id="mobileControls">
            <div class="ctrl-group">
                <div id="btn-left" class="btn-ctrl">◀</div><div id="btn-right" class="btn-ctrl">▶</div>
            </div>
            <div class="ctrl-group">
                <div id="btn-gas" class="btn-ctrl btn-action" style="background: rgba(0, 255, 204, 0.2); border-color: #00ffcc;">TIẾN</div>
                <div id="btn-brake" class="btn-ctrl btn-action" style="background: rgba(255, 51, 102, 0.2); border-color: #ff3366; color: #ff99bb;">LÙI</div>
            </div>
        </div>
        <button onclick="exitGameToMenu()" style="position:absolute; top:15px; right:15px; background:#1e293b; border:1.5px solid #ff3366; color:white; padding:8px 12px; font-size:12px; font-weight:bold; border-radius:6px; cursor:pointer; z-index:15;">🏳️ RỜI</button>
    </div>
        <script>
        let scene, camera, renderer, playerBike;
        let gameState = "MENU"; let selectedLevel = null; let maxUnlockedLevel = 1;
        let speed = 0; let maxSpeed = 0; let trackLength = 0;
        const acceleration = 0.007; const friction = 0.98; const brakeForce = 0.018; const trackWidth = 13;
        
        let bikeVelocityY = 0; const gravity = 0.0065; let isAirborne = false; let isDead = false;
        let respawnX = 0, respawnY = 0, respawnZ = 0;
        let inputForward = false, inputReverse = false, inputLeft = false, inputRight = false;
        let activeRoadSegments = {}; const segmentLength = 5; const renderDistanceChunks = 70;
        
        let skidMarksArray = []; // Mảng chứa các vết trượt lốp

        function loadProgress() {
            maxUnlockedLevel = parseInt(localStorage.getItem("cyber360_max_lvl") || "1");
            const container = document.getElementById("levelGridContainer"); container.innerHTML = "";
            for (let i = 1; i <= 30; i++) { // Phục hồi 30 màn chơi
                const btn = document.createElement("button"); btn.innerText = i;
                
                // Đổi màu nút theo 3 chặng để dễ phân biệt
                if (i > maxUnlockedLevel) { btn.className = "level-btn locked"; btn.disabled = true; } 
                else {
                    btn.className = "level-btn" + (i === selectedLevel ? " active" : "");
                    if(i >= 11 && i <= 20) btn.style.borderBottom = "3px solid #d97706"; // Chặng sương cam
                    if(i >= 21) btn.style.borderBottom = "3px solid #9333ea"; // Chặng tối tăm
                    btn.onclick = () => { selectedLevel = i; loadProgress(); document.getElementById("mainPlayBtn").style.display = "block"; };
                }
                container.appendChild(btn);
            }
        }

        function getTrackInfo(zPos) {
            if (zPos > 5) return { centerX: 0, centerY: 0, isGap: false, isRamp: false, obstacleType: 0 };
            
            let curveFreq = 0.0025 + (selectedLevel * 0.0005);
            let curveAmp = 16 + (selectedLevel * 2.0);
            let centerX = Math.sin(zPos * curveFreq) * curveAmp + Math.cos(zPos * 0.01) * (curveAmp * 0.3);
            let centerY = (zPos * 0.035) + Math.sin(zPos * 0.005) * 10;

            let blockIndex = Math.floor(Math.abs(zPos) / 50);
            let isGap = false; let isRamp = false; let obstacleType = 0;

            if (blockIndex > 0) {
                let subPos = Math.abs(zPos) % 50;
                let gapWidth = Math.min(24, 12 + selectedLevel * 0.8);
                if (subPos > 25 && subPos < 25 + gapWidth) isGap = true; 
                // Tần suất dốc bay giảm dần ở level cao
                let hasRampChance = Math.max(0.2, 1.0 - (selectedLevel * 0.03));
                if (subPos >= 19 && subPos <= 25 && Math.random() < hasRampChance) isRamp = true;

                if (!isGap && !isRamp && subPos > 5 && subPos < 12) {
                    let obsSeed = Math.abs(Math.sin(blockIndex * 99));
                    let obstacleChanceThreshold = 0.3 + (selectedLevel * 0.04);
                    if (obsSeed < obstacleChanceThreshold) obstacleType = obsSeed < (obstacleChanceThreshold * 0.5) ? 1 : 2;
                }
            }
            return { centerX, centerY, isGap, isRamp, obstacleType };
        }

        function buildBikeMesh() {
            const bikeGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.9, roughness: 0.1 });
            const rubber = new THREE.MeshStandardMaterial({ color: 0x111827 });
            const wheelGeo = new THREE.TorusGeometry(0.45, 0.05, 8, 24);
            const w1 = new THREE.Mesh(wheelGeo, rubber); w1.position.set(0, 0.5, -0.65); bikeGroup.add(w1);
            const w2 = new THREE.Mesh(wheelGeo, rubber); w2.position.set(0, 0.5, 0.65); bikeGroup.add(w2);
            const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.9).rotateX(Math.PI/4), mat); b1.position.set(0,0.65,-0.1); bikeGroup.add(b1);
            return bikeGroup;
        }

        function initAndStartGame() {
            if (selectedLevel === null) return;
            let targetKM = (selectedLevel <= 3) ? 10 : 10 + (selectedLevel - 3) * 10;
            let displayMaxSpeed = (selectedLevel <= 3) ? 65 : 65 + (selectedLevel - 3) * 5;
            trackLength = targetKM * 1000; maxSpeed = displayMaxSpeed / 54;

            document.getElementById("menuOverlay").style.display = "none";
            document.getElementById("gameContainer").style.display = "block";
            document.getElementById("hud-level-id").innerText = selectedLevel;
            document.getElementById("target-dist").innerText = targetKM; document.getElementById("total-length").innerText = targetKM;

            gameState = "PLAYING"; speed = 0; bikeVelocityY = 0; isAirborne = false; isDead = false; activeRoadSegments = {}; skidMarksArray = [];

            scene = new THREE.Scene(); 
            
            // XỬ LÝ KHÍ HẬU SƯƠNG MÙ THEO 3 CHẶNG
            if (selectedLevel <= 10) {
                scene.background = new THREE.Color(0x02040a); scene.fog = new THREE.FogExp2(0x060914, 0.015); // Chặng 1: Thoáng
            } else if (selectedLevel <= 20) {
                scene.background = new THREE.Color(0x2a1408); scene.fog = new THREE.FogExp2(0x78350f, 0.035); // Chặng 2: Sương cam đặc
            } else {
                scene.background = new THREE.Color(0x000000); scene.fog = new THREE.FogExp2(0x050505, 0.055); // Chặng 3: Tối đen kịt
            }

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById("gameContainer").appendChild(renderer.domElement);

            scene.add(new THREE.DirectionalLight(0xffffff, 1.2).position.set(10, 30, 15)); scene.add(new THREE.AmbientLight(0x1e1b4b, 0.8));

            let initTrack = getTrackInfo(0); respawnX = initTrack.centerX; respawnY = initTrack.centerY; respawnZ = 0;
            playerBike = buildBikeMesh(); playerBike.position.set(respawnX, respawnY, respawnZ); scene.add(playerBike);
            animateLoop();
        }
                    function updateDynamicTrackMesh(centerZ) {
            let currentSegmentIdx = Math.floor(centerZ / segmentLength);
            for (let i = currentSegmentIdx - 8; i > currentSegmentIdx - renderDistanceChunks; i--) {
                if (!activeRoadSegments[i]) {
                    let zPos = i * segmentLength; let trackData = getTrackInfo(zPos);
                    if (!trackData.isGap) {
                        let nextTrackData = getTrackInfo(zPos - segmentLength);
                        const roadGroup = new THREE.Group();
                        let roadThickness = trackData.isRamp ? 0.4 : 0.15;
                        const roadMat = new THREE.MeshStandardMaterial({ color: trackData.isRamp ? 0xea580c : 0x1e293b, roughness: 0.4, metalness: 0.1 });
                        const mainRoadMesh = new THREE.Mesh(new THREE.BoxGeometry(trackWidth, roadThickness, segmentLength + 0.05), roadMat); mainRoadMesh.position.y = roadThickness/2; roadGroup.add(mainRoadMesh);

                        const guardRailMat = new THREE.MeshBasicMaterial({ color: 0xff2e93 }); 
                        const leftRail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, segmentLength + 0.05), guardRailMat); leftRail.position.set(-trackWidth/2, 0.4, 0); roadGroup.add(leftRail);
                        const rightRail = leftRail.clone(); rightRail.position.x = trackWidth/2; roadGroup.add(rightRail);

                        if (trackData.obstacleType > 0) { 
                            const obsGeo = new THREE.BoxGeometry(trackData.obstacleType === 1 ? 3.5 : 2.0, 0.8, 1.0);
                            const obs = new THREE.Mesh(obsGeo, new THREE.MeshStandardMaterial({ color: trackData.obstacleType === 1 ? 0xd97706 : 0x0284c7 }));
                            obs.position.set((Math.sin(i) * (trackWidth - 5.0))/2, 0.5, 0); roadGroup.add(obs);
                        }
                        roadGroup.position.set(trackData.centerX, (trackData.centerY + nextTrackData.centerY)/2, (zPos + (zPos - segmentLength))/2);
                        roadGroup.lookAt(new THREE.Vector3(nextTrackData.centerX, nextTrackData.centerY, zPos - segmentLength));
                        scene.add(roadGroup); activeRoadSegments[i] = roadGroup;
                    }
                }
            }
            for (let key in activeRoadSegments) { if (parseInt(key) > currentSegmentIdx + 12 || parseInt(key) < currentSegmentIdx - renderDistanceChunks - 15) { scene.remove(activeRoadSegments[key]); delete activeRoadSegments[key]; } }
        }

        // TẠO VẾT TRƯỢT LỐP ĐEN (SKID MARKS) TRÊN MẶT ĐƯỜNG
        function createSkidMark(x, y, z) {
            const skidGeo = new THREE.PlaneGeometry(0.3, 0.8);
            const skidMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.7 });
            const mark = new THREE.Mesh(skidGeo, skidMat);
            mark.position.set(x, y + 0.2, z);
            mark.rotation.x = -Math.PI / 2;
            mark.rotation.z = playerBike.rotation.y; // Vết xoay theo hướng bánh xe
            scene.add(mark);
            skidMarksArray.push(mark);
            if(skidMarksArray.length > 50) { scene.remove(skidMarksArray[0]); skidMarksArray.shift(); } // Giới hạn số lượng để mượt máy
        }

        function triggerCrash(message) {
            if (isDead) return; isDead = true; speed = 0; bikeVelocityY = 0; isAirborne = false;
            playerBike.position.set(respawnX, respawnY, respawnZ); playerBike.rotation.set(0, 0, 0);
            let timer = 3; const dialog = document.getElementById("alert-text"); dialog.style.display = "block";
            let countEngine = setInterval(() => {
                timer--; if (timer <= 0) { clearInterval(countEngine); dialog.style.display = "none"; isDead = false; }
                else { dialog.innerHTML = `💥 TAI NẠN LẬT XE!<br><span style="font-size:12px;color:#cbd5e1;">${message}</span><br><b style="color:#facc15;">Hồi sinh sau ${timer}s</b>`; }
            }, 1000);
            dialog.innerHTML = `💥 TAI NẠN LẬT XE!<br><span style="font-size:12px;color:#cbd5e1;">${message}</span><br><b style="color:#facc15;">Hồi sinh sau ${timer}s</b>`;
        }

        function runCoreGameUpdateLogic() {
            if (gameState !== "PLAYING" || isDead) return;

            let isDrifting = false;
            if (inputForward) { speed = Math.min(speed + acceleration, maxSpeed); }
            else if (inputReverse) { 
                speed = speed > 0 ? Math.max(speed - brakeForce, 0) : Math.max(speed - acceleration, -maxSpeed * 0.3); 
                if(speed > 0.2) isDrifting = true; // Phanh gấp ở tốc độ cao
            } else { speed *= friction; if (Math.abs(speed) < 0.002) speed = 0; }

            if (inputLeft) { playerBike.rotation.y += 0.045; if(speed > 0.4) isDrifting = true; } // Bẻ lái gấp
            if (inputRight) { playerBike.rotation.y -= 0.045; if(speed > 0.4) isDrifting = true; }

            // Nếu đang drift hoặc phanh gấp thì sinh ra vết trượt lốp
            if(isDrifting && !isAirborne && Math.random() > 0.3) {
                createSkidMark(playerBike.position.x, playerBike.position.y, playerBike.position.z);
            }

            playerBike.position.x -= Math.sin(playerBike.rotation.y) * speed; playerBike.position.z -= Math.cos(playerBike.rotation.y) * speed;
            updateDynamicTrackMesh(playerBike.position.z);

            let currentLocInfo = getTrackInfo(playerBike.position.z);
            let distanceFromPathCenter = Math.abs(playerBike.position.x - currentLocInfo.centerX);

            if (!currentLocInfo.isGap && !isAirborne && distanceFromPathCenter >= (trackWidth / 2 - 0.4)) { triggerCrash("ĐÂM VÀO RÀO CHẮN MÉP ĐƯỜNG!"); return; }
            if (currentLocInfo.isGap && !isAirborne) { isAirborne = true; bikeVelocityY = speed * 0.08; }
            if (!currentLocInfo.isGap && distanceFromPathCenter > trackWidth / 2) { isAirborne = true; }
            if (currentLocInfo.isRamp && !isAirborne && speed > 0.12) { isAirborne = true; bikeVelocityY = 0.12 + (speed * 0.1); } // Độ cao nảy thu thấp lại

            if (!isAirborne) {
                playerBike.position.y = currentLocInfo.centerY;
                let lookupAhead = getTrackInfo(playerBike.position.z - 0.4); playerBike.rotation.x = Math.atan2(lookupAhead.centerY - currentLocInfo.centerY, 0.4);
            } else {
                bikeVelocityY -= gravity; playerBike.position.y += bikeVelocityY; playerBike.rotation.x += 0.015;
                let groundState = getTrackInfo(playerBike.position.z);
                if (playerBike.position.y <= groundState.centerY) {
                    let distCheck = Math.abs(playerBike.position.x - groundState.centerX);
                    if (!groundState.isGap && distCheck <= trackWidth / 2) {
                        playerBike.position.y = groundState.centerY; isAirborne = false; bikeVelocityY = 0;
                        respawnX = groundState.centerX; respawnY = groundState.centerY; respawnZ = playerBike.position.z;
                    } else if (playerBike.position.y < groundState.centerY - 22) { triggerCrash("RƠI XUỐNG VỰC SÂU!"); return; }
                }
            }

            let drivenKM = parseFloat((-playerBike.position.z / 1000).toFixed(3));
            document.getElementById("distance").innerText = Math.max(0, drivenKM); document.getElementById("speed").innerText = Math.floor(Math.abs(speed) * 60);

            if (playerBike.position.z <= -trackLength) {
                gameState = "WIN"; speed = 0; let nextLevelIdx = selectedLevel + 1;
                if (selectedLevel === maxUnlockedLevel && maxUnlockedLevel < 30) { maxUnlockedLevel = nextLevelIdx; localStorage.setItem("cyber360_max_lvl", maxUnlockedLevel.toString()); }
                document.getElementById("win-desc").innerText = `Hoàn thành Màn ${selectedLevel}!`; document.getElementById("win-screen").style.display = "block";
            }

            let currentBikeYaw = playerBike.rotation.y;
            camera.position.set(playerBike.position.x + Math.sin(currentBikeYaw) * 5.5, playerBike.position.y + 2.8, playerBike.position.z + Math.cos(currentBikeYaw) * 5.5);
            camera.lookAt(playerBike.position.x, playerBike.position.y + 0.5, playerBike.position.z);
        }

        function exitGameToMenu() { gameState = "MENU"; loadProgress(); document.getElementById("menuOverlay").style.display = "flex"; document.getElementById("gameContainer").style.display = "none"; document.getElementById("win-screen").style.display = "none"; if (renderer) { renderer.dispose(); try { document.getElementById("gameContainer").removeChild(renderer.domElement); } catch(err){} } }
        function animateLoop() { if (gameState !== "PLAYING") return; requestAnimationFrame(animateLoop); runCoreGameUpdateLogic(); if (renderer && scene && camera) renderer.render(scene, camera); }
        
        setupMobileButtonEngine('btn-gas', (active) => inputForward = active); setupMobileButtonEngine('btn-brake', (active) => inputReverse = active); setupMobileButtonEngine('btn-left', (active) => inputLeft = active); setupMobileButtonEngine('btn-right', (active) => inputRight = active);
        function setupMobileButtonEngine(id, callback) { const btn = document.getElementById(id); if (!btn) return; btn.addEventListener('touchstart', (e) => { e.preventDefault(); callback(true); }); btn.addEventListener('touchend', (e) => { e.preventDefault(); callback(false); }); btn.addEventListener('mousedown', () => callback(true)); btn.addEventListener('mouseup', () => callback(false)); btn.addEventListener('mouseleave', () => callback(false)); }
        document.addEventListener("DOMContentLoaded", loadProgress); window.addEventListener('resize', () => { if (!camera || !renderer) return; camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
